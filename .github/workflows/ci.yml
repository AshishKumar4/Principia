name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Lean and build Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          auto-config: false
          build: true

      - name: Install and prove candidate sandbox
        run: |
          # Ubuntu noble ships bubblewrap 0.9.0, which predates the overlay
          # options the evaluator sandbox requires; build the pinned release.
          sudo apt-get update
          sudo apt-get install --yes libcap-dev meson ninja-build
          curl -fsSL -o /tmp/bubblewrap.tar.xz \
            https://github.com/containers/bubblewrap/releases/download/v0.11.1/bubblewrap-0.11.1.tar.xz
          echo "c1b7455a1283b1295879a46d5f001dfd088c0bb0f238abb5e128b3583a246f71  /tmp/bubblewrap.tar.xz" | sha256sum --check
          tar -xJf /tmp/bubblewrap.tar.xz -C /tmp
          meson setup /tmp/bubblewrap-0.11.1/build /tmp/bubblewrap-0.11.1 \
            -Dman=disabled -Dselinux=disabled -Dtests=false
          ninja -C /tmp/bubblewrap-0.11.1/build
          sudo install -m 0755 /tmp/bubblewrap-0.11.1/build/bwrap /usr/local/bin/bwrap
          bwrap --version | grep -F 0.11.1
          # Noble's AppArmor restriction strips capabilities from user
          # namespaces created by unpackaged binaries; grant the pinned bwrap
          # the same unconfined-userns profile Ubuntu ships for its own.
          sudo tee /etc/apparmor.d/bwrap-local > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap-local /usr/local/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/bwrap-local
          SANDBOX_PROBE=$(mktemp -d)
          mkdir -p "$SANDBOX_PROBE/lower" "$SANDBOX_PROBE/upper" "$SANDBOX_PROBE/work"
          printf host > "$SANDBOX_PROBE/lower/host.txt"
          bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --setenv PATH /usr/bin:/bin \
            --ro-bind /usr /usr --ro-bind /etc /etc --ro-bind /bin /bin \
            --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp \
            --overlay-src "$SANDBOX_PROBE/lower" \
            --overlay "$SANDBOX_PROBE/upper" "$SANDBOX_PROBE/work" "$SANDBOX_PROBE/lower" \
            -- sh -c 'cat "$1/host.txt"; printf overlay > "$1/new.txt"' sh "$SANDBOX_PROBE/lower"
          test ! -e "$SANDBOX_PROBE/lower/new.txt"
          test "$(cat "$SANDBOX_PROBE/upper/new.txt")" = overlay
          rm -rf "$SANDBOX_PROBE"

      - name: Install pinned lean4checker
        run: |
          git clone --filter=blob:none https://github.com/leanprover/lean4checker.git /tmp/lean4checker
          git -C /tmp/lean4checker checkout 91a7f0e8e9dffe927089f5a6edcfeeb8a0e07709
          ~/.elan/bin/lake --dir /tmp/lean4checker build
          mkdir -p ~/.local/bin
          ln -s /tmp/lean4checker/.lake/build/bin/lean4checker ~/.local/bin/lean4checker

      - name: Run all Lean and governance gates
        run: scripts/check.sh

      - name: Run platform behavior tests
        run: python3 -m unittest discover -s tests -v

      - name: Link frozen changes to review evidence
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BASE"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push: no prior range to inspect"
          else
            python3 scripts/check_spec_review_evidence.py --base "$BASE" --head "$HEAD_SHA"
          fi
