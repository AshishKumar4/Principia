[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "principia"
version = "0.1.0"
description = "Machine-checked physics discovery around the Lean constraint atlas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
principia = "principia.cli:main"

[tool.setuptools.packages.find]
include = ["principia*"]
